    <!-- GitHub Pages SPA routing fix: reads redirect from 404.html -->
    <script>
      (function() {
        var redirect = sessionStorage.redirect;
        delete sessionStorage.redirect;
        if (redirect && redirect !== location.href) {
          history.replaceState(null, null, redirect);
        }
        // Also handle the ?p= query string redirect from 404.html
        var l = window.location;
        if (l.search && l.search[1] === 'p') {
          var decoded = l.search.slice(1).split('&').reduce(function(s, v) {
            var k = v.split('=')[0];
            var val = v.split('=').slice(1).join('=').replace(/~and~/g, '&');
            if (k === 'p') s.pathname = '/' + val;
            else if (k === 'q') s.search = '?' + val;
            return s;
          }, { search: '' });
          window.history.replaceState(
            null, null,
            l.pathname.split('/').slice(0, 2).join('/') +
            decoded.pathname + decoded.search + l.hash
          );
        }
      })();
    </script>
